# Bitnami Kafka chart 32.4.3. Credentials are supplied by the pre-created
# kafka-sasl Secret; this file intentionally contains no secret material.
fullnameOverride: kafka
kraft:
  enabled: true
zookeeper:
  enabled: false
controller:
  replicaCount: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  heapOpts: "-Xmx256m -Xms256m"
  persistence:
    enabled: true
    storageClass: gp3
    size: 20Gi
broker:
  replicaCount: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  heapOpts: "-Xmx512m -Xms512m"
  persistence:
    enabled: true
    storageClass: gp3
    size: 20Gi
listeners:
  client:
    protocol: SASL_PLAINTEXT
  interbroker:
    protocol: SASL_PLAINTEXT
  controller:
    protocol: SASL_PLAINTEXT
sasl:
  enabled: true
  client:
    users:
      - app
  existingSecret: kafka-sasl
  interBrokerUser: admin
  controllerUser: controller
  interBrokerMechanism: plain
  controllerMechanism: plain
  mechanisms: plain
extraEnvVars:
  - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
    value: "false"
provisioning:
  enabled: true
  numPartitions: 3
  replicationFactor: 3
  topics:
    - name: os.events
      partitions: 3
      replicationFactor: 3
      config:
        retention.ms: "604800000"
    - name: os.events.retry
      partitions: 3
      replicationFactor: 3
      config:
        retention.ms: "604800000"
    - name: os.events.dlt
      partitions: 3
      replicationFactor: 3
      config:
        retention.ms: "604800000"
