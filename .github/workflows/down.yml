name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment to destroy
        required: true
        default: hml
        type: choice
        options: [hml, prod]
      confirm:
        description: Type DESTROY HML or DESTROY PROD to confirm deletion
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  down:
    name: Destroy ${{ inputs.environment }} infrastructure
    uses: ./.github/workflows/ci.yml
    with:
      environment: ${{ inputs.environment }}
      action: destroy
      academy_mode: false
      confirm: ${{ inputs.confirm }}
    secrets: inherit
