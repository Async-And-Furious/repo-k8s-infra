name: Terraform CI/CD

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: hml
        type: choice
        options: [hml, prod]
      action:
        description: Terraform operation
        required: true
        default: plan
        type: choice
        options: [plan, apply]
      aws_academy:
        description: Use AWS Academy LabRole compatibility mode
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      manage_iam:
        description: Allow Terraform to create IAM and IRSA resources
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      lab_role_arn:
        description: Existing LabRole ARN (required when Academy mode is true)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: .
  TF_VAR_eks_cluster_role_arn: ${{ vars.EKS_CLUSTER_ROLE_ARN }}
  TF_VAR_eks_node_role_arn: ${{ vars.EKS_NODE_ROLE_ARN }}
  TF_VAR_load_balancer_controller_role_arn: ${{ vars.LOAD_BALANCER_CONTROLLER_ROLE_ARN }}
  TF_VAR_lab_role_arn: ${{ vars.LAB_ROLE_ARN }}

jobs:
  validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend=false
      - run: terraform validate

  plan:
    name: Terraform Plan
    needs: validate
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'plan' || inputs.action == 'apply')
    runs-on: ${{ inputs.aws_academy == 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","eks-private"]') }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Allow GitHub Actions to reach Academy EKS
        if: inputs.aws_academy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H 'Accept: application/vnd.github+json' https://api.github.com/meta |
            jq -ce '{
              cluster_endpoint_public_access: true,
              cluster_endpoint_public_access_cidrs: (.actions |
                if type == "array" and length > 0 and all(.[]; . != "0.0.0.0/0") then .
                else error("GitHub Actions CIDR response is empty or too broad") end)
            }' > academy.auto.tfvars.json
      - name: Validate Terraform mode
        if: inputs.aws_academy == 'true'
        shell: bash
        env:
          MANAGE_IAM: ${{ inputs.manage_iam }}
          LAB_ROLE_ARN: ${{ inputs.lab_role_arn != '' && inputs.lab_role_arn || vars.LAB_ROLE_ARN }}
        run: |
          set -euo pipefail
          [[ "$MANAGE_IAM" == "false" ]] || { echo "AWS Academy mode requires manage_iam=false." >&2; exit 1; }
          [[ -n "$LAB_ROLE_ARN" ]] || { echo "AWS Academy mode requires a non-empty lab_role_arn." >&2; exit 1; }
      - name: Validate AWS credential mode
        shell: bash
        run: |
          set -euo pipefail
          credentials=0
          [[ -n "$AWS_ACCESS_KEY_ID" ]] && ((credentials+=1))
          [[ -n "$AWS_SECRET_ACCESS_KEY" ]] && ((credentials+=1))
          [[ -n "$AWS_SESSION_TOKEN" ]] && ((credentials+=1))
          if [[ "$credentials" != 0 && "$credentials" != 3 ]]; then
            echo "Academy credentials must be provided together: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and AWS_SESSION_TOKEN." >&2
            exit 1
          fi
      - name: Configure AWS credentials (Academy)
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_SESSION_TOKEN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure AWS credentials (OIDC)
        if: env.AWS_ACCESS_KEY_ID == '' && env.AWS_SECRET_ACCESS_KEY == '' && env.AWS_SESSION_TOKEN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -reconfigure -input=false -backend-config=organization=async_furious -backend-config=workspaces.name=tc3-k8s-${{ inputs.environment }}
      - run: terraform plan -input=false -var=environment=${{ inputs.environment }} -var=aws_academy=${{ inputs.aws_academy }} -var=manage_iam=${{ inputs.manage_iam }} '-var=lab_role_arn=${{ inputs.lab_role_arn != '' && inputs.lab_role_arn || vars.LAB_ROLE_ARN }}' -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: tfplan
          retention-days: 1

  apply:
    name: Terraform Apply
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ${{ inputs.aws_academy == 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","eks-private"]') }}
    environment: ${{ inputs.environment }}-apply
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Allow GitHub Actions to reach Academy EKS
        if: inputs.aws_academy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H 'Accept: application/vnd.github+json' https://api.github.com/meta |
            jq -ce '{
              cluster_endpoint_public_access: true,
              cluster_endpoint_public_access_cidrs: (.actions |
                if type == "array" and length > 0 and all(.[]; . != "0.0.0.0/0") then .
                else error("GitHub Actions CIDR response is empty or too broad") end)
            }' > academy.auto.tfvars.json
      - name: Validate AWS credential mode
        shell: bash
        run: |
          set -euo pipefail
          credentials=0
          [[ -n "$AWS_ACCESS_KEY_ID" ]] && ((credentials+=1))
          [[ -n "$AWS_SECRET_ACCESS_KEY" ]] && ((credentials+=1))
          [[ -n "$AWS_SESSION_TOKEN" ]] && ((credentials+=1))
          if [[ "$credentials" != 0 && "$credentials" != 3 ]]; then
            echo "Academy credentials must be provided together: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and AWS_SESSION_TOKEN." >&2
            exit 1
          fi
      - name: Configure AWS credentials (Academy)
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_SESSION_TOKEN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure AWS credentials (OIDC)
        if: env.AWS_ACCESS_KEY_ID == '' && env.AWS_SECRET_ACCESS_KEY == '' && env.AWS_SESSION_TOKEN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -reconfigure -input=false -backend-config=organization=async_furious -backend-config=workspaces.name=tc3-k8s-${{ inputs.environment }}
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
      - run: terraform apply -input=false -auto-approve tfplan
