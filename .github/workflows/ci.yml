          trap 'rm -f "$error_file"' EXIT
          if aws eks describe-cluster --name "$CLUSTER_NAME" >/dev/null 2>"$error_file"; then
            private_access="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.resourcesVpcConfig.endpointPrivateAccess --output text)"
            public_access="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.resourcesVpcConfig.endpointPublicAccess --output text)"
            public_cidrs="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query 'join(`,`,cluster.resourcesVpcConfig.publicAccessCidrs)' --output text)"
            printf 'PROD_ENDPOINT_ORIGINAL_PRIVATE_ACCESS=%s\nPROD_ENDPOINT_ORIGINAL_PUBLIC_ACCESS=%s\nPROD_ENDPOINT_ORIGINAL_PUBLIC_CIDRS=%s\nPROD_ENDPOINT_EXPOSED=true\n' "$private_access" "$public_access" "$public_cidrs" >> "$GITHUB_ENV"
            if [[ "$private_access" != "True" || "$public_access" != "True" || "$public_cidrs" != "$RUNNER_CIDR" ]]; then
              config_file="$(mktemp)"
              trap 'rm -f "$config_file" "$error_file"' EXIT
              jq -n --arg cidr "$RUNNER_CIDR" '{endpointPrivateAccess: true, endpointPublicAccess: true, publicAccessCidrs: [$cidr]}' > "$config_file"
              update_id=""
              for attempt in {1..60}; do
                if update_id="$(aws eks update-cluster-config --name "$CLUSTER_NAME" --resources-vpc-config "file://$config_file" --query update.id --output text 2>"$error_file")"; then break; fi
                grep -q 'ResourceInUseException' "$error_file" || { cat "$error_file" >&2; exit 1; }
                sleep 10
              done
              [[ -n "$update_id" ]] || { echo "Timed out waiting to start EKS endpoint update." >&2; exit 1; }
              for attempt in {1..60}; do
                status="$(aws eks describe-update --name "$CLUSTER_NAME" --update-id "$update_id" --query update.status --output text)"
                [[ "$status" == "Successful" ]] && break
                [[ "$status" == "InProgress" ]] || { aws eks describe-update --name "$CLUSTER_NAME" --update-id "$update_id" --query 'update.{status:status,errors:errors}' --output json >&2; exit 1; }
                sleep 10
              done
              [[ "$status" == "Successful" ]] || { echo "Timed out waiting for EKS endpoint update." >&2; exit 1; }
            fi
          elif grep -q 'ResourceNotFoundException' "$error_file"; then
            echo "EKS cluster does not exist yet; no endpoint restore is needed."
          else
            cat "$error_file" >&2
            exit 1
          fi
      - name: Prepare production Terraform variables
        if: env.ENVIRONMENT == 'prod'
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg environment "$ENVIRONMENT" \
            --arg aws_region "$AWS_REGION" \
            --argjson aws_academy "$AWS_ACADEMY" \
            --argjson manage_iam "$MANAGE_IAM" \
            --arg lab_role_arn "$LAB_ROLE_ARN" \
            --arg runner_cidr "$RUNNER_CIDR" '{
