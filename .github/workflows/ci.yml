              sleep 10
            done
            [[ -n "$update_id" ]] || { echo "Timed out waiting to restore EKS endpoint settings." >&2; exit 1; }
            for attempt in {1..60}; do
              status="$(aws eks describe-update --name "$CLUSTER_NAME" --update-id "$update_id" --query update.status --output text)"
