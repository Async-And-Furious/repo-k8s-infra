name: Terraform CI/CD

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: hml
        type: choice
        options: [hml, prod]
      action:
        description: Terraform operation
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy-plan, destroy]
      aws_academy:
        description: Use AWS Academy LabRole compatibility mode
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      manage_iam:
        description: Allow Terraform to create IAM and IRSA resources
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      lab_role_arn:
        description: Existing LabRole ARN (required when Academy mode is true)
        required: false
        default: ""
        type: string
      confirm:
        description: Type "APPLY PROD" for production apply or "DESTROY HML" for destroy
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_eks_cluster_role_arn: ${{ vars.EKS_CLUSTER_ROLE_ARN }}
  TF_VAR_eks_node_role_arn: ${{ vars.EKS_NODE_ROLE_ARN }}
  TF_VAR_load_balancer_controller_role_arn: ${{ vars.LOAD_BALANCER_CONTROLLER_ROLE_ARN }}
  TF_VAR_lab_role_arn: ${{ vars.LAB_ROLE_ARN }}

jobs:
  validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.13"
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend=false
      - run: terraform validate

  terraform:
    name: Terraform ${{ inputs.action }}
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    # Academy runs on a hosted runner; normal mode needs the private-EKS runner.
    runs-on: ${{ inputs.aws_academy == 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","eks-private"]') }}
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      AWS_ACADEMY: ${{ inputs.aws_academy }}
      MANAGE_IAM: ${{ inputs.manage_iam }}
      LAB_ROLE_ARN: ${{ inputs.lab_role_arn != '' && inputs.lab_role_arn || vars.LAB_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      CLUSTER_NAME: tc3-eks-${{ inputs.environment }}
    steps:
      - name: Guard production apply
        if: inputs.environment == 'prod' && inputs.action == 'apply'
        run: |
          [ "$CONFIRM" = "APPLY PROD" ] || { echo 'Production apply requires confirm="APPLY PROD".' >&2; exit 1; }
        env:
          CONFIRM: ${{ inputs.confirm }}
      - name: Guard HML destroy
        if: inputs.action == 'destroy-plan' || inputs.action == 'destroy'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ENVIRONMENT" == "hml" ]] || { echo "Destroy operations are restricted to HML." >&2; exit 1; }
          [[ "$AWS_ACADEMY" == "true" ]] || { echo "Destroy operations require AWS Academy mode." >&2; exit 1; }
          if [[ "$ACTION" == "destroy" && "$CONFIRM" != "DESTROY HML" ]]; then
            echo 'Destroy requires confirm="DESTROY HML".' >&2
            exit 1
          fi
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.13"
      - name: Discover Academy HML runner address
        if: inputs.aws_academy == 'true' && inputs.environment == 'hml'
        shell: bash
        run: |
          set -euo pipefail
          address="$(curl -fsSL --proto '=https' https://checkip.amazonaws.com)"
          RUNNER_CIDR="$(python3 - "$address" <<'PY'
          import ipaddress
          import sys

          address = ipaddress.ip_address(sys.argv[1].strip())
          if address.version != 4 or not address.is_global:
              raise SystemExit("Runner address is not a globally routable IPv4 address")
          print(f"{address}/32")
          PY
          )"
          echo "RUNNER_CIDR=$RUNNER_CIDR" >> "$GITHUB_ENV"
      - name: Prepare Terraform variables
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$AWS_ACADEMY" == "true" && "$ENVIRONMENT" == "hml" ]]; then
            jq -n --arg environment "$ENVIRONMENT" \
              --arg aws_region "$AWS_REGION" \
              --argjson aws_academy "$AWS_ACADEMY" \
              --argjson manage_iam "$MANAGE_IAM" \
              --arg lab_role_arn "$LAB_ROLE_ARN" \
              --arg runner_cidr "$RUNNER_CIDR" '{
                  environment: $environment,
                  aws_region: $aws_region,
                  aws_academy: $aws_academy,
                  manage_iam: $manage_iam,
                  lab_role_arn: $lab_role_arn,
                  cluster_endpoint_public_access: true,
                  cluster_endpoint_public_access_cidrs: [$runner_cidr]
                }' > terraform.auto.tfvars.json
          else
            jq -n --arg environment "$ENVIRONMENT" \
              --arg aws_region "$AWS_REGION" \
              --argjson aws_academy "$AWS_ACADEMY" \
              --argjson manage_iam "$MANAGE_IAM" \
              --arg lab_role_arn "$LAB_ROLE_ARN" '{
                environment: $environment,
                aws_region: $aws_region,
                aws_academy: $aws_academy,
                manage_iam: $manage_iam,
                lab_role_arn: $lab_role_arn
              }' > terraform.auto.tfvars.json
          fi
      - name: Validate Terraform mode
        if: inputs.aws_academy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MANAGE_IAM" == "false" ]] || { echo "AWS Academy mode requires manage_iam=false." >&2; exit 1; }
          [[ -n "$LAB_ROLE_ARN" ]] || { echo "AWS Academy mode requires a non-empty lab_role_arn." >&2; exit 1; }
      - name: Validate AWS credential mode
        shell: bash
        run: |
          set -euo pipefail
          credentials=0
          for value in "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN"; do
            [[ -n "$value" ]] && credentials=$((credentials + 1))
          done
          if [[ "$credentials" != 0 && "$credentials" != 3 ]]; then
            echo "Academy credentials must be provided together: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and AWS_SESSION_TOKEN." >&2
            exit 1
          fi
      - name: Configure AWS credentials (Academy)
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_SESSION_TOKEN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure AWS credentials (OIDC)
        if: env.AWS_ACCESS_KEY_ID == '' && env.AWS_SECRET_ACCESS_KEY == '' && env.AWS_SESSION_TOKEN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Inspect destroy state backend
        if: inputs.action == 'destroy-plan' || inputs.action == 'destroy'
        shell: bash
        run: bash .github/scripts/inspect-backend.sh repo-k8s-infra "$ENVIRONMENT"
      - name: Initialize Terraform for destroy
        if: env.DESTROY_STATE_OBJECT == 'true'
        run: terraform init -reconfigure -input=false -backend-config=backend.hcl
      - name: Check destroy state contents
        if: (inputs.action == 'destroy-plan' || inputs.action == 'destroy') && env.DESTROY_STATE_OBJECT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          state_list="$(terraform state list)"
          if [[ -n "$state_list" ]]; then
            echo "DESTROY_HAS_STATE=true" >> "$GITHUB_ENV"
          else
            echo "DESTROY_HAS_STATE=false" >> "$GITHUB_ENV"
            echo "Terraform state contains no resources; destroy is a no-op."
          fi
      - name: Allow Academy HML runner to reach existing EKS cluster
        if: inputs.aws_academy == 'true' && inputs.environment == 'hml' && ((inputs.action == 'plan' || inputs.action == 'apply') || env.DESTROY_HAS_STATE == 'true')
        shell: bash
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if aws eks describe-cluster --name "$CLUSTER_NAME" >/dev/null 2>"$error_file"; then
            private_access="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.resourcesVpcConfig.endpointPrivateAccess --output text)"
            public_access="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.resourcesVpcConfig.endpointPublicAccess --output text)"
            public_cidrs="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query 'join(`,`,cluster.resourcesVpcConfig.publicAccessCidrs)' --output text)"
            status=""
            if [[ "$private_access" == "True" && "$public_access" == "True" && "$public_cidrs" == "$RUNNER_CIDR" ]]; then
              status="Successful"
              echo "EKS endpoint already allows only this runner."
            else
            update_id=""
            for attempt in {1..60}; do
              if update_id="$(aws eks update-cluster-config --name "$CLUSTER_NAME" --resources-vpc-config "endpointPrivateAccess=true,endpointPublicAccess=true,publicAccessCidrs=$RUNNER_CIDR" --query update.id --output text 2>"$error_file")"; then
                break
              fi
              if grep -q 'ResourceInUseException' "$error_file"; then
                sleep 10
              else
                cat "$error_file" >&2
                exit 1
              fi
            done
            [[ -n "$update_id" ]] || { echo "Timed out waiting to start EKS endpoint update." >&2; exit 1; }
            for attempt in {1..60}; do
              status="$(aws eks describe-update --name "$CLUSTER_NAME" --update-id "$update_id" --query update.status --output text)"
              [[ "$status" == "Successful" ]] && break
              if [[ "$status" != "InProgress" ]]; then
                aws eks describe-update --name "$CLUSTER_NAME" --update-id "$update_id" --query 'update.{status:status,errors:errors}' --output json >&2
                exit 1
              fi
              sleep 10
            done
            fi
            [[ "$status" == "Successful" ]] || { echo "Timed out waiting for EKS endpoint update." >&2; exit 1; }
          elif grep -q 'ResourceNotFoundException' "$error_file"; then
            echo "EKS cluster does not exist; continuing."
          else
            cat "$error_file" >&2
            exit 1
          fi
      - name: Bootstrap Terraform state backend
        if: inputs.action == 'plan' || inputs.action == 'apply'
        shell: bash
        run: bash .github/scripts/bootstrap-backend.sh repo-k8s-infra "$ENVIRONMENT"
      - name: Initialize Terraform
        if: inputs.action == 'plan' || inputs.action == 'apply'
        run: terraform init -reconfigure -input=false -backend-config=backend.hcl
      - name: Terraform plan
        if: inputs.action == 'plan'
        run: terraform plan -input=false
      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve
      - name: Terraform destroy plan
        if: inputs.action == 'destroy-plan' && env.DESTROY_HAS_STATE == 'true'
        run: terraform plan -destroy -input=false
      - name: Terraform destroy
        if: inputs.action == 'destroy' && env.DESTROY_HAS_STATE == 'true'
        run: |
          terraform plan -destroy -input=false -out=destroy.tfplan
          terraform apply -input=false destroy.tfplan
      - name: Disable Academy HML public EKS endpoint
        if: always() && inputs.aws_academy == 'true' && inputs.environment == 'hml' && ((inputs.action == 'plan' || inputs.action == 'apply') || env.DESTROY_HAS_STATE == 'true')
        shell: bash
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if aws eks describe-cluster --name "$CLUSTER_NAME" >/dev/null 2>"$error_file"; then
            private_access="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.resourcesVpcConfig.endpointPrivateAccess --output text)"
            public_access="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.resourcesVpcConfig.endpointPublicAccess --output text)"
            status=""
            if [[ "$private_access" == "True" && "$public_access" == "False" ]]; then
              status="Successful"
              echo "EKS public endpoint is already disabled."
            else
            update_id=""
            for attempt in {1..60}; do
              if update_id="$(aws eks update-cluster-config --name "$CLUSTER_NAME" --resources-vpc-config endpointPrivateAccess=true,endpointPublicAccess=false --query update.id --output text 2>"$error_file")"; then
                break
              fi
              if grep -q 'ResourceInUseException' "$error_file"; then
                sleep 10
              else
                cat "$error_file" >&2
                exit 1
              fi
            done
            [[ -n "$update_id" ]] || { echo "Timed out waiting to start EKS endpoint cleanup." >&2; exit 1; }
            for attempt in {1..60}; do
              status="$(aws eks describe-update --name "$CLUSTER_NAME" --update-id "$update_id" --query update.status --output text)"
              [[ "$status" == "Successful" ]] && break
              if [[ "$status" != "InProgress" ]]; then
                aws eks describe-update --name "$CLUSTER_NAME" --update-id "$update_id" --query 'update.{status:status,errors:errors}' --output json >&2
                exit 1
              fi
              sleep 10
            done
            fi
            [[ "$status" == "Successful" ]] || { echo "Timed out waiting for EKS endpoint cleanup." >&2; exit 1; }
          elif grep -q 'ResourceNotFoundException' "$error_file"; then
            echo "EKS cluster does not exist; no endpoint cleanup is needed."
          else
            cat "$error_file" >&2
            exit 1
          fi
      - name: Summarize destroy
        if: always() && (inputs.action == 'destroy-plan' || inputs.action == 'destroy')
        shell: bash
        run: |
          if [[ "$DESTROY_HAS_STATE" == "true" ]]; then
            echo "### HML ${ACTION} used the existing Terraform state (${JOB_STATUS})" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$DESTROY_STATE_OBJECT" == "false" || "$DESTROY_HAS_STATE" == "false" ]]; then
            echo "### HML ${ACTION}: no resources in Terraform state; no-op" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### HML ${ACTION} did not reach state evaluation (${JOB_STATUS})" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "The workflow does not delete the S3 bucket or Terraform state object." >> "$GITHUB_STEP_SUMMARY"
        env:
          ACTION: ${{ inputs.action }}
          DESTROY_HAS_STATE: ${{ env.DESTROY_HAS_STATE }}
          DESTROY_STATE_OBJECT: ${{ env.DESTROY_STATE_OBJECT }}
          JOB_STATUS: ${{ job.status }}
      - name: Remove generated Terraform inputs
        if: always()
        run: rm -f terraform.auto.tfvars.json backend.hcl destroy.tfplan
