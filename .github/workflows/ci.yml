name: Terraform CI/CD

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment
        required: true
        type: string
      action:
        description: Terraform operation
        required: true
        type: string
      academy_mode:
        description: Use AWS Academy temporary credentials and LabRole
        required: true
        type: boolean
      lab_role_arn:
        description: Existing LabRole ARN (required when Academy mode is true)
        required: false
        type: string
      confirm:
        description: Type "APPLY PROD", "DESTROY HML", or "DESTROY PROD" as confirmation
        required: false
        type: string
      force_unlock_id:
        description: Optional Terraform lock ID override for confirmed HML destroy only
        required: false
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_SESSION_TOKEN:
        required: false
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: hml
        type: choice
        options: [hml, prod]
      action:
        description: Terraform operation
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy-plan, destroy]
      academy_mode:
        description: Use AWS Academy temporary credentials and LabRole
        required: true
        default: false
        type: boolean
      lab_role_arn:
        description: Existing LabRole ARN (required when Academy mode is true)
        required: false
        default: ""
        type: string
      confirm:
        description: Type "APPLY PROD", "DESTROY HML", or "DESTROY PROD" as confirmation
        required: false
        default: ""
        type: string
      force_unlock_id:
        description: Optional stale Terraform lock ID for HML destroy only
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && 'hml' || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'prod' || (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.environment || github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_eks_cluster_role_arn: ${{ vars.EKS_CLUSTER_ROLE_ARN }}
  TF_VAR_eks_node_role_arn: ${{ vars.EKS_NODE_ROLE_ARN }}
  TF_VAR_load_balancer_controller_role_arn: ${{ vars.LOAD_BALANCER_CONTROLLER_ROLE_ARN }}
  TF_VAR_lab_role_arn: ${{ vars.LAB_ROLE_ARN }}

jobs:
  validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.13"
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend=false
      - run: terraform validate

  plan:
    name: Terraform plan
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && 'hml' || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || inputs.environment == 'hml' && 'hml' || 'production' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      ENVIRONMENT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && 'hml' || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'prod' || inputs.environment }}
      ACTION: ${{ github.event_name == 'push' && 'apply' || inputs.action }}
      AWS_ACADEMY: ${{ github.event_name == 'workflow_dispatch' && inputs.academy_mode == true || false }}
      MANAGE_IAM: ${{ github.event_name != 'workflow_dispatch' || inputs.academy_mode != true }}
      LAB_ROLE_ARN: ${{ github.event_name == 'push' && vars.LAB_ROLE_ARN || (inputs.lab_role_arn != '' && inputs.lab_role_arn || vars.LAB_ROLE_ARN) }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      CLUSTER_NAME: tc3-eks-${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && 'hml' || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'prod' || inputs.environment }}
      HML_ENDPOINT_EXPOSED: "false"
      HML_ENDPOINT_ORIGINAL_PRIVATE_ACCESS: ""
      HML_ENDPOINT_ORIGINAL_PUBLIC_ACCESS: ""
      HML_ENDPOINT_ORIGINAL_PUBLIC_CIDRS: ""
      PROD_ENDPOINT_EXPOSED: "false"
      PROD_ENDPOINT_ORIGINAL_PRIVATE_ACCESS: ""
      PROD_ENDPOINT_ORIGINAL_PUBLIC_ACCESS: ""
      PROD_ENDPOINT_ORIGINAL_PUBLIC_CIDRS: ""
      AWS_CREDENTIAL_PREFLIGHT_SUCCEEDED: "false"
    steps:
      - name: Guard production apply
        if: github.event_name == 'workflow_dispatch' && env.ENVIRONMENT == 'prod' && env.ACTION == 'apply'
        run: |
          [ "$CONFIRM" = "APPLY PROD" ] || { echo 'Production apply requires confirm="APPLY PROD".' >&2; exit 1; }
        env:
          CONFIRM: ${{ inputs.confirm }}
      - name: Guard destroy
        if: env.ACTION == 'destroy-plan' || env.ACTION == 'destroy'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || { echo "Destroy operations require workflow_dispatch." >&2; exit 1; }
          case "$ENVIRONMENT" in
            hml) expected_confirm="DESTROY HML" ;;
            prod) expected_confirm="DESTROY PROD" ;;
            *) echo "Destroy target must be hml or prod." >&2; exit 1 ;;
          esac
          if [[ "$CONFIRM" != "$expected_confirm" ]]; then
            echo "Destroy requires confirm=\"$expected_confirm\"." >&2
            exit 1
          fi
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.13"
      - name: Discover HML runner address
        if: env.ENVIRONMENT == 'hml'
        shell: bash
        run: |
          set -euo pipefail
          address="$(curl -fsSL --proto '=https' https://checkip.amazonaws.com)"
          RUNNER_CIDR="$(python3 - "$address" <<'PY'
          import ipaddress
          import sys

          address = ipaddress.ip_address(sys.argv[1].strip())
          if address.version != 4 or not address.is_global:
              raise SystemExit("Runner address is not a globally routable IPv4 address")
          print(f"{address}/32")
          PY
          )"
          echo "RUNNER_CIDR=$RUNNER_CIDR" >> "$GITHUB_ENV"
      - name: Discover production runner address
        if: env.ENVIRONMENT == 'prod'
        shell: bash
        run: |
          set -euo pipefail
          address="$(curl -fsSL --proto '=https' https://checkip.amazonaws.com)"
          RUNNER_CIDR="$(python3 - "$address" <<'PY'
          import ipaddress
          import sys

          address = ipaddress.ip_address(sys.argv[1].strip())
          if address.version != 4 or not address.is_global:
              raise SystemExit("Runner address is not a globally routable IPv4 address")
          print(f"{address}/32")
          PY
          )"
          echo "RUNNER_CIDR=$RUNNER_CIDR" >> "$GITHUB_ENV"
      - name: Prepare Terraform variables
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ENVIRONMENT" == "hml" ]]; then
            jq -n --arg environment "$ENVIRONMENT" \
              --arg aws_region "$AWS_REGION" \
              --argjson aws_academy "$AWS_ACADEMY" \
              --argjson manage_iam "$MANAGE_IAM" \
              --arg lab_role_arn "$LAB_ROLE_ARN" \
              --arg runner_cidr "$RUNNER_CIDR" '{
                  environment: $environment,
                  aws_region: $aws_region,
                  aws_academy: $aws_academy,
                  manage_iam: $manage_iam,
                  lab_role_arn: $lab_role_arn,
                  cluster_endpoint_public_access: true,
                  cluster_endpoint_public_access_cidrs: [$runner_cidr]
                }' > terraform.auto.tfvars.json
          else
            jq -n --arg environment "$ENVIRONMENT" \
              --arg aws_region "$AWS_REGION" \
              --argjson aws_academy "$AWS_ACADEMY" \
              --argjson manage_iam "$MANAGE_IAM" \
              --arg lab_role_arn "$LAB_ROLE_ARN" \
              --arg runner_cidr "$RUNNER_CIDR" '{
                environment: $environment,
                aws_region: $aws_region,
                aws_academy: $aws_academy,
                manage_iam: $manage_iam,
                lab_role_arn: $lab_role_arn,
                cluster_endpoint_public_access: true,
                cluster_endpoint_public_access_cidrs: [$runner_cidr]
              }' > terraform.auto.tfvars.json
          fi
      - name: Validate Terraform mode
        if: env.AWS_ACADEMY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MANAGE_IAM" == "false" ]] || { echo "AWS Academy mode requires manage_iam=false." >&2; exit 1; }
          [[ -n "$LAB_ROLE_ARN" ]] || { echo "AWS Academy mode requires a non-empty lab_role_arn." >&2; exit 1; }
      - name: Validate AWS credentials
        if: env.AWS_ACADEMY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          credentials=0
          for value in "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN"; do
            [[ -n "$value" ]] && credentials=$((credentials + 1))
          done
          [[ "$credentials" == 3 ]] || { echo "Both HML and production require all three temporary AWS Academy credentials." >&2; exit 1; }
      - name: Configure AWS credentials with session token
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_SESSION_TOKEN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure AWS credentials without session token
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_SESSION_TOKEN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Preflight AWS credentials and Terraform state
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking AWS identity (read-only)..."
          aws sts get-caller-identity --query 'Arn' --output text >/dev/null || {
            echo "AWS credential preflight failed: credentials are missing, expired, or unauthorized." >&2
            exit 1
          }
          echo "Checking the account-qualified Terraform state (read-only)..."
          bash .github/scripts/inspect-backend.sh repo-k8s-infra "$ENVIRONMENT"
          echo "AWS_CREDENTIAL_PREFLIGHT_SUCCEEDED=true" >> "$GITHUB_ENV"
      - name: Inspect destroy state backend
        if: env.ACTION == 'destroy-plan' || env.ACTION == 'destroy'
        shell: bash
        run: bash .github/scripts/inspect-backend.sh repo-k8s-infra "$ENVIRONMENT"
      - name: Initialize Terraform for destroy
        if: env.DESTROY_STATE_OBJECT == 'true'
        run: terraform init -reconfigure -input=false -backend-config=backend.hcl
      - name: Recover stale HML Terraform lock
        if: env.ACTION == 'destroy' && env.ENVIRONMENT == 'hml' && inputs.confirm == 'DESTROY HML' && env.DESTROY_STATE_OBJECT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bucket="$(awk -F'"' '$1 ~ /^bucket[[:space:]]*=/ { print $2 }' backend.hcl)"
          state_key="$(awk -F'"' '$1 ~ /^key[[:space:]]*=/ { print $2 }' backend.hcl)"
          expected_state_key="repo-k8s-infra/hml/terraform.tfstate"
          [[ -n "$bucket" && "$state_key" == "$expected_state_key" ]] || { echo "Terraform backend is not the exact HML state; refusing lock recovery." >&2; exit 1; }

          lock_file="$(mktemp)"
          error_file="$(mktemp)"
          trap 'rm -f "$lock_file" "$error_file"' EXIT
          if ! aws s3api get-object --bucket "$bucket" --key "${state_key}.tflock" "$lock_file" >/dev/null 2>"$error_file"; then
            if grep -Eq '\(404\)|Not Found|NoSuchBucket|NoSuchKey' "$error_file"; then
              echo "No Terraform lock exists for the HML state; continuing."
              exit 0
            fi
            echo "Unable to read the HML Terraform lock object; refusing lock recovery." >&2
            exit 1
          fi

          lock_details="$(python3 - "$lock_file" <<'PY'
          import datetime
          import json
          import pathlib
          import sys
          import time

          try:
              lock = json.loads(pathlib.Path(sys.argv[1]).read_text())
              if not isinstance(lock, dict):
                  raise ValueError
              lock_id = lock.get("ID") or lock.get("LockID")
              created = lock.get("Created") or lock.get("Timestamp")
              if not isinstance(lock_id, str) or not lock_id or not isinstance(created, str) or not created:
                  raise ValueError
              timestamp = datetime.datetime.fromisoformat(created.replace("Z", "+00:00"))
              if timestamp.tzinfo is None:
                  raise ValueError
              age = time.time() - timestamp.timestamp()
              if age < 900:
                  raise RuntimeError
              print(f"{lock_id}\t{age:.0f}")
          except RuntimeError:
              raise SystemExit("Terraform lock is recent (under 15 minutes); refusing unlock.")
          except (OSError, ValueError, TypeError, json.JSONDecodeError):
              raise SystemExit("Terraform lock ID/timestamp could not be parsed; refusing unlock.")
          PY
          )"
          IFS=$'\t' read -r discovered_lock_id lock_age <<< "$lock_details"
          [[ "$discovered_lock_id" =~ ^[[:alnum:]_.:-]+$ && -n "$lock_age" ]] || { echo "Terraform lock ID/timestamp could not be parsed; refusing unlock." >&2; exit 1; }

          if [[ -n "$FORCE_UNLOCK_ID" && "$FORCE_UNLOCK_ID" != "$discovered_lock_id" ]]; then
            echo "force_unlock_id does not match the discovered HML lock; refusing unlock." >&2
            exit 1
          fi
          selected_lock_id="${FORCE_UNLOCK_ID:-$discovered_lock_id}"
          echo "::add-mask::$discovered_lock_id"
          echo "Recovering confirmed stale HML Terraform lock (age ${lock_age}s)."
          terraform force-unlock -force "$selected_lock_id"
        env:
          CONFIRM: ${{ inputs.confirm }}
          FORCE_UNLOCK_ID: ${{ inputs.force_unlock_id }}
      - name: Check destroy state contents
        if: (env.ACTION == 'destroy-plan' || env.ACTION == 'destroy') && env.DESTROY_STATE_OBJECT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          state_list="$(terraform state list)"
          if [[ -n "$state_list" ]]; then
            echo "DESTROY_HAS_STATE=true" >> "$GITHUB_ENV"
          else
            echo "DESTROY_HAS_STATE=false" >> "$GITHUB_ENV"
            echo "Terraform state contains no resources; destroy is a no-op."
          fi
      - name: Allow HML runner to reach existing EKS cluster
        if: env.ENVIRONMENT == 'hml' && ((env.ACTION == 'plan' || env.ACTION == 'apply') || env.DESTROY_HAS_STATE == 'true')
        shell: bash
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if aws eks describe-cluster --name "$CLUSTER_NAME" >/dev/null 2>"$error_file"; then
            private_access="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.resourcesVpcConfig.endpointPrivateAccess --output text)"
            public_access="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.resourcesVpcConfig.endpointPublicAccess --output text)"
            public_cidrs="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query 'join(`,`,cluster.resourcesVpcConfig.publicAccessCidrs)' --output text)"
            printf 'HML_ENDPOINT_ORIGINAL_PRIVATE_ACCESS=%s\nHML_ENDPOINT_ORIGINAL_PUBLIC_ACCESS=%s\nHML_ENDPOINT_ORIGINAL_PUBLIC_CIDRS=%s\nHML_ENDPOINT_EXPOSED=true\n' "$private_access" "$public_access" "$public_cidrs" >> "$GITHUB_ENV"
            status=""
            if [[ "$private_access" == "True" && "$public_access" == "True" && "$public_cidrs" == "$RUNNER_CIDR" ]]; then
              status="Successful"
              echo "EKS endpoint already allows only this runner."
            else
            update_id=""
            for attempt in {1..60}; do
              if update_id="$(aws eks update-cluster-config --name "$CLUSTER_NAME" --resources-vpc-config "endpointPrivateAccess=true,endpointPublicAccess=true,publicAccessCidrs=$RUNNER_CIDR" --query update.id --output text 2>"$error_file")"; then
                break
              fi
              if grep -q 'ResourceInUseException' "$error_file"; then
                sleep 10
              else
                cat "$error_file" >&2
                exit 1
              fi
            done
            [[ -n "$update_id" ]] || { echo "Timed out waiting to start EKS endpoint update." >&2; exit 1; }
            for attempt in {1..60}; do
              status="$(aws eks describe-update --name "$CLUSTER_NAME" --update-id "$update_id" --query update.status --output text)"
              [[ "$status" == "Successful" ]] && break
              if [[ "$status" != "InProgress" ]]; then
                aws eks describe-update --name "$CLUSTER_NAME" --update-id "$update_id" --query 'update.{status:status,errors:errors}' --output json >&2
                exit 1
              fi
              sleep 10
            done
            fi
            [[ "$status" == "Successful" ]] || { echo "Timed out waiting for EKS endpoint update." >&2; exit 1; }
          elif grep -q 'ResourceNotFoundException' "$error_file"; then
            echo "EKS cluster does not exist; continuing."
          else
            cat "$error_file" >&2
            exit 1
          fi
      - name: Allow production runner to reach existing EKS cluster
        if: env.ENVIRONMENT == 'prod' && ((env.ACTION == 'plan' || env.ACTION == 'apply') || env.DESTROY_HAS_STATE == 'true')
        shell: bash
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if aws eks describe-cluster --name "$CLUSTER_NAME" >/dev/null 2>"$error_file"; then
            private_access="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.resourcesVpcConfig.endpointPrivateAccess --output text)"
            public_access="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.resourcesVpcConfig.endpointPublicAccess --output text)"
            public_cidrs="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query 'join(`,`,cluster.resourcesVpcConfig.publicAccessCidrs)' --output text)"
            printf 'PROD_ENDPOINT_ORIGINAL_PRIVATE_ACCESS=%s\nPROD_ENDPOINT_ORIGINAL_PUBLIC_ACCESS=%s\nPROD_ENDPOINT_ORIGINAL_PUBLIC_CIDRS=%s\nPROD_ENDPOINT_EXPOSED=true\n' "$private_access" "$public_access" "$public_cidrs" >> "$GITHUB_ENV"
            if [[ "$private_access" != "True" || "$public_access" != "True" || "$public_cidrs" != "$RUNNER_CIDR" ]]; then
              config_file="$(mktemp)"
              trap 'rm -f "$config_file" "$error_file"' EXIT
              jq -n --arg cidr "$RUNNER_CIDR" '{endpointPrivateAccess: true, endpointPublicAccess: true, publicAccessCidrs: [$cidr]}' > "$config_file"
              update_id=""
              for attempt in {1..60}; do
                if update_id="$(aws eks update-cluster-config --name "$CLUSTER_NAME" --resources-vpc-config "file://$config_file" --query update.id --output text 2>"$error_file")"; then break; fi
                grep -q 'ResourceInUseException' "$error_file" || { cat "$error_file" >&2; exit 1; }
                sleep 10
              done
              [[ -n "$update_id" ]] || { echo "Timed out waiting to start EKS endpoint update." >&2; exit 1; }
              for attempt in {1..60}; do
                status="$(aws eks describe-update --name "$CLUSTER_NAME" --update-id "$update_id" --query update.status --output text)"
                [[ "$status" == "Successful" ]] && break
                [[ "$status" == "InProgress" ]] || { aws eks describe-update --name "$CLUSTER_NAME" --update-id "$update_id" --query 'update.{status:status,errors:errors}' --output json >&2; exit 1; }
                sleep 10
              done
              [[ "$status" == "Successful" ]] || { echo "Timed out waiting for EKS endpoint update." >&2; exit 1; }
            fi
          elif grep -q 'ResourceNotFoundException' "$error_file"; then
            echo "EKS cluster does not exist; continuing."
          else
            cat "$error_file" >&2
            exit 1
          fi
      - name: Bootstrap Terraform state backend
        if: env.ACTION == 'plan' || env.ACTION == 'apply'
        shell: bash
        run: bash .github/scripts/bootstrap-backend.sh repo-k8s-infra "$ENVIRONMENT"
      - name: Initialize Terraform
        if: env.ACTION == 'plan' || env.ACTION == 'apply'
        run: terraform init -reconfigure -input=false -backend-config=backend.hcl
      - name: Terraform plan
        if: env.ACTION == 'plan' || env.ACTION == 'apply'
        run: terraform plan -input=false -out=tfplan
      - name: Save Terraform plan artifact
        if: env.ACTION == 'plan' || env.ACTION == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          path: tfplan
          if-no-files-found: error
          retention-days: 7
      - name: Terraform destroy plan
        if: (env.ACTION == 'destroy-plan' || env.ACTION == 'destroy') && env.DESTROY_HAS_STATE == 'true'
        run: terraform plan -destroy -input=false -out=destroy.tfplan
      - name: Empty target ECR repository before destroy
        if: env.ACTION == 'destroy' && (env.ENVIRONMENT == 'hml' || env.ENVIRONMENT == 'prod') && env.DESTROY_HAS_STATE == 'true' && env.AWS_CREDENTIAL_PREFLIGHT_SUCCEEDED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          repository_name="tc3-app-$ENVIRONMENT"
          next_token=""
          while :; do
            response_file="$(mktemp)"
            error_file="$(mktemp)"
            trap 'rm -f "$response_file" "$error_file"' EXIT
            if [[ -n "$next_token" ]]; then
              if ! aws ecr list-images --repository-name "$repository_name" --filter tagStatus=ANY --no-paginate --max-results 100 --next-token "$next_token" --output json > "$response_file" 2>"$error_file"; then
                if grep -q 'RepositoryNotFoundException' "$error_file"; then
                  echo "ECR repository $repository_name does not exist; cleanup is a no-op."
                  exit 0
                fi
                cat "$error_file" >&2
                exit 1
              fi
            else
              if ! aws ecr list-images --repository-name "$repository_name" --filter tagStatus=ANY --no-paginate --max-results 100 --output json > "$response_file" 2>"$error_file"; then
                if grep -q 'RepositoryNotFoundException' "$error_file"; then
                  echo "ECR repository $repository_name does not exist; cleanup is a no-op."
                  exit 0
                fi
                cat "$error_file" >&2
                exit 1
              fi
            fi
            image_ids="$(jq -c '.imageIds // []' "$response_file")"
            if [[ "$image_ids" != "[]" ]]; then
              aws ecr batch-delete-image --repository-name "$repository_name" --image-ids "$image_ids" >/dev/null
            fi
            next_token="$(jq -r '.nextToken // empty' "$response_file")"
            rm -f "$response_file" "$error_file"
            [[ -n "$next_token" ]] || break
          done
      - name: Terraform destroy
        if: env.ACTION == 'destroy' && env.DESTROY_HAS_STATE == 'true'
        run: terraform apply -input=false destroy.tfplan
      - name: Restore HML EKS endpoint access
        if: always() && env.HML_ENDPOINT_EXPOSED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$HML_ENDPOINT_ORIGINAL_PRIVATE_ACCESS" && -n "$HML_ENDPOINT_ORIGINAL_PUBLIC_ACCESS" ]] || { echo "Original EKS endpoint settings were not captured; refusing cleanup." >&2; exit 1; }
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if aws eks describe-cluster --name "$CLUSTER_NAME" >/dev/null 2>"$error_file"; then
            current_private_access="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.resourcesVpcConfig.endpointPrivateAccess --output text)"
            current_public_access="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.resourcesVpcConfig.endpointPublicAccess --output text)"
            current_public_cidrs="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query 'join(`,`,cluster.resourcesVpcConfig.publicAccessCidrs)' --output text)"
            private_access="$HML_ENDPOINT_ORIGINAL_PRIVATE_ACCESS"
            public_access="$HML_ENDPOINT_ORIGINAL_PUBLIC_ACCESS"
            public_cidrs="$HML_ENDPOINT_ORIGINAL_PUBLIC_CIDRS"
            status=""
            if [[ "$current_private_access" == "$private_access" && "$current_public_access" == "$public_access" && "$current_public_cidrs" == "$public_cidrs" ]]; then
              status="Successful"
              echo "EKS endpoint already matches its original settings."
            else
            config_file="$(mktemp)"
            trap 'rm -f "$config_file"' EXIT
            private_json="$( [[ "$private_access" == "True" ]] && echo true || echo false )"
            public_json="$( [[ "$public_access" == "True" ]] && echo true || echo false )"
            jq -n --argjson private "$private_json" --argjson public "$public_json" --arg cidrs "$public_cidrs" '{endpointPrivateAccess: $private, endpointPublicAccess: $public, publicAccessCidrs: (if $cidrs == "" then [] else ($cidrs | split(",")) end)}' > "$config_file"
            update_id=""
            for attempt in {1..60}; do
              if update_id="$(aws eks update-cluster-config --name "$CLUSTER_NAME" --resources-vpc-config "file://$config_file" --query update.id --output text 2>"$error_file")"; then
                break
              fi
              if grep -q 'ResourceInUseException' "$error_file"; then
                sleep 10
              else
                cat "$error_file" >&2
                exit 1
              fi
            done
            [[ -n "$update_id" ]] || { echo "Timed out waiting to start EKS endpoint cleanup." >&2; exit 1; }
            for attempt in {1..60}; do
              status="$(aws eks describe-update --name "$CLUSTER_NAME" --update-id "$update_id" --query update.status --output text)"
              [[ "$status" == "Successful" ]] && break
              if [[ "$status" != "InProgress" ]]; then
                aws eks describe-update --name "$CLUSTER_NAME" --update-id "$update_id" --query 'update.{status:status,errors:errors}' --output json >&2
                exit 1
              fi
              sleep 10
            done
            fi
            [[ "$status" == "Successful" ]] || { echo "Timed out waiting for EKS endpoint cleanup." >&2; exit 1; }
          elif grep -q 'ResourceNotFoundException' "$error_file"; then
            echo "EKS cluster does not exist; no endpoint cleanup is needed."
          else
            cat "$error_file" >&2
            exit 1
          fi
      - name: Restore production EKS endpoint access
        if: always() && env.PROD_ENDPOINT_EXPOSED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PROD_ENDPOINT_ORIGINAL_PRIVATE_ACCESS" && -n "$PROD_ENDPOINT_ORIGINAL_PUBLIC_ACCESS" ]] || { echo "Original production EKS endpoint settings were not captured; refusing cleanup." >&2; exit 1; }
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if aws eks describe-cluster --name "$CLUSTER_NAME" >/dev/null 2>"$error_file"; then
            current_private_access="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.resourcesVpcConfig.endpointPrivateAccess --output text)"
            current_public_access="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.resourcesVpcConfig.endpointPublicAccess --output text)"
            current_public_cidrs="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query 'join(`,`,cluster.resourcesVpcConfig.publicAccessCidrs)' --output text)"
            if [[ "$current_private_access" == "$PROD_ENDPOINT_ORIGINAL_PRIVATE_ACCESS" && "$current_public_access" == "$PROD_ENDPOINT_ORIGINAL_PUBLIC_ACCESS" && "$current_public_cidrs" == "$PROD_ENDPOINT_ORIGINAL_PUBLIC_CIDRS" ]]; then
              echo "EKS endpoint already matches its original settings."
              exit 0
            fi
            config_file="$(mktemp)"
            trap 'rm -f "$config_file" "$error_file"' EXIT
            private_json="$( [[ "$PROD_ENDPOINT_ORIGINAL_PRIVATE_ACCESS" == "True" ]] && echo true || echo false )"
            public_json="$( [[ "$PROD_ENDPOINT_ORIGINAL_PUBLIC_ACCESS" == "True" ]] && echo true || echo false )"
            jq -n --argjson private "$private_json" --argjson public "$public_json" --arg cidrs "$PROD_ENDPOINT_ORIGINAL_PUBLIC_CIDRS" '{endpointPrivateAccess: $private, endpointPublicAccess: $public, publicAccessCidrs: (if $cidrs == "" then [] else ($cidrs | split(",")) end)}' > "$config_file"
            update_id=""
            for attempt in {1..60}; do
              if update_id="$(aws eks update-cluster-config --name "$CLUSTER_NAME" --resources-vpc-config "file://$config_file" --query update.id --output text 2>"$error_file")"; then break; fi
              grep -q 'ResourceInUseException' "$error_file" || { cat "$error_file" >&2; exit 1; }
              sleep 10
            done
            [[ -n "$update_id" ]] || { echo "Timed out waiting to restore production EKS endpoint settings." >&2; exit 1; }
            for attempt in {1..60}; do
              status="$(aws eks describe-update --name "$CLUSTER_NAME" --update-id "$update_id" --query update.status --output text)"
              [[ "$status" == "Successful" ]] && break
              [[ "$status" == "InProgress" ]] || { aws eks describe-update --name "$CLUSTER_NAME" --update-id "$update_id" --query 'update.{status:status,errors:errors}' --output json >&2; exit 1; }
              sleep 10
            done
            [[ "$status" == "Successful" ]] || { echo "Timed out waiting to restore production EKS endpoint settings." >&2; exit 1; }
          elif grep -q 'ResourceNotFoundException' "$error_file"; then
            echo "EKS cluster no longer exists; no endpoint restore is needed."
          else
            cat "$error_file" >&2
            exit 1
          fi
      - name: Summarize destroy
        if: always() && (env.ACTION == 'destroy-plan' || env.ACTION == 'destroy')
        shell: bash
        run: |
          if [[ "$DESTROY_HAS_STATE" == "true" ]]; then
            echo "### ${ENVIRONMENT} ${ACTION} used the existing Terraform state (${JOB_STATUS})" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$DESTROY_STATE_OBJECT" == "false" || "$DESTROY_HAS_STATE" == "false" ]]; then
            echo "### ${ENVIRONMENT} ${ACTION}: no resources in Terraform state; no-op" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${ENVIRONMENT} ${ACTION} did not reach state evaluation (${JOB_STATUS})" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "The workflow does not delete the S3 bucket or Terraform state object." >> "$GITHUB_STEP_SUMMARY"
        env:
          ACTION: ${{ inputs.action }}
          DESTROY_HAS_STATE: ${{ env.DESTROY_HAS_STATE }}
          DESTROY_STATE_OBJECT: ${{ env.DESTROY_STATE_OBJECT }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          JOB_STATUS: ${{ job.status }}
      - name: Remove generated Terraform inputs
        if: always()
        run: rm -f terraform.auto.tfvars.json backend.hcl tfplan destroy.tfplan

  apply:
    name: Terraform apply
    needs: plan
    if: needs.plan.result == 'success' && ((github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply'))
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && 'hml' || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || inputs.environment == 'hml' && 'hml' || 'production' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      ENVIRONMENT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && 'hml' || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'prod' || inputs.environment }}
      ACTION: apply
      AWS_ACADEMY: ${{ github.event_name == 'workflow_dispatch' && inputs.academy_mode == true || false }}
      MANAGE_IAM: ${{ github.event_name != 'workflow_dispatch' || inputs.academy_mode != true }}
      LAB_ROLE_ARN: ${{ github.event_name == 'push' && vars.LAB_ROLE_ARN || (inputs.lab_role_arn != '' && inputs.lab_role_arn || vars.LAB_ROLE_ARN) }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      CLUSTER_NAME: tc3-eks-${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && 'hml' || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'prod' || inputs.environment }}
      HML_ENDPOINT_EXPOSED: "false"
      HML_ENDPOINT_ORIGINAL_PRIVATE_ACCESS: ""
      HML_ENDPOINT_ORIGINAL_PUBLIC_ACCESS: ""
      HML_ENDPOINT_ORIGINAL_PUBLIC_CIDRS: ""
      PROD_ENDPOINT_EXPOSED: "false"
      PROD_ENDPOINT_ORIGINAL_PRIVATE_ACCESS: ""
      PROD_ENDPOINT_ORIGINAL_PUBLIC_ACCESS: ""
      PROD_ENDPOINT_ORIGINAL_PUBLIC_CIDRS: ""
    steps:
      - name: Guard production apply
        if: github.event_name == 'workflow_dispatch' && env.ENVIRONMENT == 'prod'
        run: |
          [ "${{ inputs.confirm }}" = "APPLY PROD" ] || { echo 'Production apply requires confirm="APPLY PROD".' >&2; exit 1; }
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.13"
      - name: Validate AWS credentials
        if: env.AWS_ACADEMY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          credentials=0
          for value in "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN"; do
            [[ -n "$value" ]] && credentials=$((credentials + 1))
          done
          [[ "$credentials" == 3 ]] || { echo "Both HML and production require all three temporary AWS Academy credentials." >&2; exit 1; }
      - name: Configure AWS credentials with session token
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_SESSION_TOKEN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure AWS credentials without session token
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_SESSION_TOKEN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Discover HML runner address
        if: env.ENVIRONMENT == 'hml'
        shell: bash
        run: |
          set -euo pipefail
          address="$(curl -fsSL --proto '=https' https://checkip.amazonaws.com)"
          RUNNER_CIDR="$(python3 - "$address" <<'PY'
          import ipaddress
          import sys
          address = ipaddress.ip_address(sys.argv[1].strip())
          if address.version != 4 or not address.is_global:
              raise SystemExit("Runner address is not a globally routable IPv4 address")
          print(f"{address}/32")
          PY
          )"
          echo "RUNNER_CIDR=$RUNNER_CIDR" >> "$GITHUB_ENV"
      - name: Allow HML runner to reach existing EKS cluster
        if: env.ENVIRONMENT == 'hml'
        shell: bash
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if aws eks describe-cluster --name "$CLUSTER_NAME" >/dev/null 2>"$error_file"; then
            private_access="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.resourcesVpcConfig.endpointPrivateAccess --output text)"
            public_access="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.resourcesVpcConfig.endpointPublicAccess --output text)"
            public_cidrs="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query 'join(`,`,cluster.resourcesVpcConfig.publicAccessCidrs)' --output text)"
          elif grep -q 'ResourceNotFoundException' "$error_file"; then
            echo "EKS cluster does not exist yet; Terraform will create it with runner-only public access and cleanup will restore the private default."
            printf 'HML_ENDPOINT_ORIGINAL_PRIVATE_ACCESS=True\nHML_ENDPOINT_ORIGINAL_PUBLIC_ACCESS=False\nHML_ENDPOINT_ORIGINAL_PUBLIC_CIDRS=\nHML_ENDPOINT_EXPOSED=true\n' >> "$GITHUB_ENV"
            exit 0
          else
            cat "$error_file" >&2
            exit 1
          fi
          printf 'HML_ENDPOINT_ORIGINAL_PRIVATE_ACCESS=%s\nHML_ENDPOINT_ORIGINAL_PUBLIC_ACCESS=%s\nHML_ENDPOINT_ORIGINAL_PUBLIC_CIDRS=%s\nHML_ENDPOINT_EXPOSED=true\n' "$private_access" "$public_access" "$public_cidrs" >> "$GITHUB_ENV"
          if [[ "$private_access" != "True" || "$public_access" != "True" || "$public_cidrs" != "$RUNNER_CIDR" ]]; then
            config_file="$(mktemp)"
            trap 'rm -f "$config_file"' EXIT
            jq -n --arg cidr "$RUNNER_CIDR" '{endpointPrivateAccess: true, endpointPublicAccess: true, publicAccessCidrs: [$cidr]}' > "$config_file"
            update_id=""
            for attempt in {1..60}; do
              if update_id="$(aws eks update-cluster-config --name "$CLUSTER_NAME" --resources-vpc-config "file://$config_file" --query update.id --output text 2>/tmp/eks-update-error)"; then break; fi
              grep -q 'ResourceInUseException' /tmp/eks-update-error || { cat /tmp/eks-update-error >&2; exit 1; }
              sleep 10
            done
            [[ -n "$update_id" ]] || { echo "Timed out waiting for EKS endpoint update." >&2; exit 1; }
            for attempt in {1..60}; do
              status="$(aws eks describe-update --name "$CLUSTER_NAME" --update-id "$update_id" --query update.status --output text)"
              [[ "$status" == "Successful" ]] && break
              [[ "$status" == "InProgress" ]] || { aws eks describe-update --name "$CLUSTER_NAME" --update-id "$update_id" --query 'update.{status:status,errors:errors}' --output json >&2; exit 1; }
              sleep 10
            done
            [[ "$status" == "Successful" ]] || { echo "Timed out waiting for EKS endpoint update." >&2; exit 1; }
          fi
      - name: Bootstrap Terraform state backend
        shell: bash
        run: bash .github/scripts/bootstrap-backend.sh repo-k8s-infra "$ENVIRONMENT"
      - name: Initialize Terraform
        run: terraform init -reconfigure -input=false -backend-config=backend.hcl
      - name: Discover production runner address
        if: env.ENVIRONMENT == 'prod'
        shell: bash
        run: |
          set -euo pipefail
          address="$(curl -fsSL --proto '=https' https://checkip.amazonaws.com)"
          RUNNER_CIDR="$(python3 - "$address" <<'PY'
          import ipaddress
          import sys
          address = ipaddress.ip_address(sys.argv[1].strip())
          if address.version != 4 or not address.is_global:
              raise SystemExit("Runner address is not a globally routable IPv4 address")
          print(f"{address}/32")
          PY
          )"
          echo "RUNNER_CIDR=$RUNNER_CIDR" >> "$GITHUB_ENV"
      - name: Allow production runner to reach existing EKS cluster
        if: env.ENVIRONMENT == 'prod'
        shell: bash
        run: |
          set -euo pipefail
